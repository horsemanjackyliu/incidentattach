_schema-version: 3.3.0
ID: incidentattach
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
        - mkdir -p resources
modules:
  - name: incidentattach-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
#    properties:
#      REPOSITORY_ID: MY_REPO
    requires:
      - name: incidentattach-attachments
      - name: incidentattach-db
      - name: incidentattach-auth
      - name: incidentattach-destination

  - name: incidentattach-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: incidentattach-db

  - name: incidentattach-app-deployer
    type: com.sap.application.content
    path: gen
    requires:
      - name: incidentattach-html5-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources/
      requires:
        - name: incidentattachincidentattachui5
          artifacts:
            - incidentattachui5.zip
          target-path: resources/

  - name: incidentattachincidentattachui5
    type: html5
    path: app/incidentattachui5
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []

  - name: incidentattach-destinations
    type: com.sap.application.content
    requires:
      - name: incidentattach-auth
        parameters:
          service-key:
            name: incidentattach-auth-key
      - name: incidentattach-html5-repo-host
        parameters:
          service-key:
            name: incidentattach-html5-repo-host-key
      - name: srv-api
      - name: incidentattach-destination
        parameters:
          content-target: true
    build-parameters:
      no-source: true
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: incidentattach-html5-repository
              ServiceInstanceName: incidentattach-html5-repo-host
              ServiceKeyName: incidentattach-html5-repo-host-key
              sap.cloud.service: incidentattach.service
            - Name: incidentattach-auth
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: incidentattach-auth
              ServiceKeyName: incidentattach-auth-key
              sap.cloud.service: incidentattach.service

resources:
  - name: incidentattach-attachments
    type: org.cloudfoundry.managed-service
    parameters:
      service: sdm
      service-plan: free
  - name: incidentattach-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: incidentattach-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: incidentattach-${org}-${space}
        tenant-mode: dedicated
  - name: incidentattach-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            existing_destinations_policy: update
            destinations:
              - Name: incidentattach-srv-api
                URL: ~{srv-api/srv-url}
                Authentication: NoAuthentication
                Type: HTTP
                ProxyType: Internet
                HTML5.ForwardAuthToken: true
                HTML5.DynamicDestination: true
              - Name: ui5
                URL: https://ui5.sap.com
                Authentication: NoAuthentication
                Type: HTTP
                ProxyType: Internet
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true
  - name: incidentattach-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
